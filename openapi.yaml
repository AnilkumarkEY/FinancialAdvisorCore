openapi: 3.0.0
info:
  title: Financial Advisor Backend API
  description: Backend service for the financial advisor frontend.
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /users/login:
    post:
      summary: User Login
      description: Authenticates a user and returns a token if successful.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  description: The username of the user.
                  example: "test@example.com"
                password:
                  type: string
                  description: The password for the user account.
                  example: "your_password"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Login successful"
                  data:
                    type: object
                    properties:
                      token_type:
                        type: string
                        description: Type of the token
                        example: "Bearer"
                      scope:
                        type: string
                        description: Permissions granted
                        example: "5d7a7727-2a96-45ba-a82f-275e573cda4e/User.Read 5d7a7727-2a96-45ba-a82f-275e573cda4e/.default"
                      expires_in:
                        type: integer
                        description: Token expiration time in seconds
                        example: 5397
                      ext_expires_in:
                        type: integer
                        description: Extended expiration time in seconds
                        example: 5397
                      access_token:
                        type: string
                        description: The JWT access token
                        example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
                      refresh_token:
                        type: string
                        description: The refresh token
                        example: "0.Ab4ANhzjhUbV_U6CEB2Go6EXQCd3el2WKrpFqC8nXlc82k6..."
                      id_token:
                        type: string
                        description: The ID token
                        example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
        "401":
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid username or password."
        "400":
          description: Bad Request - Missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Username and password are required."

  /lead/create-lead:
    post:
      summary: Create a new lead
      description: Creates a new lead with the provided details.
      operationId: createLead
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - gender
                - mobileNumber
                - leadType
                - city
                - state
                - isNRI
                - isHNI
              properties:
                fullName:
                  type: string
                  description: Full name of the lead.
                gender:
                  type: string
                  description: Gender of the lead.
                mobileNumber:
                  type: string
                  description: Mobile number of the lead.
                leadType:
                  type: string
                  description: Type of the lead.
                email:
                  type: string
                  description: Email address of the lead.
                productInterestedIn:
                  type: array
                  items:
                    type: string
                  description: List of product IDs the lead is interested in.
                addressLine1:
                  type: string
                  description: Address line 1 of the lead.
                addressLine2:
                  type: string
                  description: Address line 2 of the lead.
                zipCode:
                  type: string
                  description: Zip code of the lead's address.
                city:
                  type: string
                  description: City of the lead's address.
                state:
                  type: string
                  description: State of the lead's address.
                isNRI:
                  type: string
                  description: Whether the lead is an NRI.
                isHNI:
                  type: string
                  description: Whether the lead is an HNI.
      responses:
        "200":
          description: Lead created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Lead created successfully."
                  leadId:
                    type: string
                    example: "12345"

  /lead/product-intrested:
    get:
      summary: Get products interested by lead
      description: Retrieves the list of products a lead is interested in.
      operationId: getProductInterested
      parameters:
        - name: leadId
          in: query
          required: true
          description: The ID of the lead for which products are to be fetched.
          schema:
            type: string
            example: "c9357f00e6524ef7ba0b045dbfcfeba5"
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: List of products interested by the lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: string

  /lead/get-lead-list:
    get:
      summary: Get lead list
      description: Retrieves the list of leads.
      operationId: getLeadList
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Lead list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      type: object
                      properties:
                        leadId:
                          type: string
                        fullName:
                          type: string

  /lead/get-all-products:
    post:
      summary: Get all products
      description: Retrieves the list of all products.
      operationId: getAllProducts
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: List of all products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        productName:
                          type: string

  /contact/update-contact:
    put:
      summary: Update an existing contact
      description: Updates an existing contact with the provided details.
      operationId: updateContact
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiasfsgergdte"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressLine1
                - idmetaContactType
                - contactValue
                - countryCode
                - state
                - pincode
                - idContact
              properties:
                addressLine1:
                  type: string
                  description: Address line 1 of the contact.
                addressLine2:
                  type: string
                  description: Address line 2 of the contact.
                idmetaContactType:
                  type: string
                  description: Meta contact type ID.
                contactValue:
                  type: string
                  description: Contact value, such as phone number or email.
                countryCode:
                  type: string
                  description: Country code.
                locationName:
                  type: string
                  description: Name of the location.
                state:
                  type: string
                  description: State of the contact's address.
                pincode:
                  type: string
                  description: Pincode of the contact's address.
                idContact:
                  type: string
                  description: Unique identifier of the contact.
      responses:
        "201":
          description: Entity contact updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Entity contact updated successfully"
                  data:
                    type: object
                    nullable: true
                    description: Additional data (if any)

  /contact/create-contact:
    post:
      summary: Create a new contact
      description: Creates a new contact with the provided details.
      operationId: createContact
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsIng1dCI6IjNQYUs0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressLine1
                - idmetaContactType
                - contactValue
                - countryCode
                - state
                - pincode
              properties:
                addressLine1:
                  type: string
                  description: Address line 1 of the contact.
                addressLine2:
                  type: string
                  description: Address line 2 of the contact.
                idmetaContactType:
                  type: string
                  description: Meta contact type ID.
                contactValue:
                  type: string
                  description: Contact value, such as phone number or email.
                countryCode:
                  type: string
                  description: Country code.
                locationName:
                  type: string
                  description: Name of the location.
                state:
                  type: string
                  description: State of the contact's address.
                pincode:
                  type: string
                  description: Pincode of the contact's address.
      responses:
        "201":
          description: Entity contact inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Entity contact inserted successfully"
                  data:
                    type: object
                    nullable: true
                    description: Additional data (if any)

  /users/get-otp:
    post:
      summary: Get OTP
      description: Sends an OTP to the user based on the provided agent code.
      operationId: getOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_code:
                  type: string
                  description: The agent code for which the OTP is requested.
                  example: "786"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "OTP sent successfully"
                  data:
                    type: object
                    nullable: true
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."
        "400":
          description: Bad Request - Invalid agent code
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid agent code."

  /users/verify-otp:
    post:
      summary: Verify OTP
      description: Verifies the provided OTP against the stored value.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otpToVerify:
                  type: string
                  description: The OTP to verify.
                  example: "771089"
      responses:
        "200":
          description: Provided OTP is correct
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Provided OTP is correct"
                  data:
                    type: boolean
                    description: Indicates if the OTP verification was successful
                    example: true
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."
        "400":
          description: Bad Request - Missing or invalid OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid or missing OTP."

  /lead/get-lead-tags:
    get:
      summary: Get Lead Tags
      description: Fetches all available lead tags.
      operationId: getLeadTags
      responses:
        "200":
          description: Lead Tags fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Lead Tags fetch successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tagmetadata:
                          type: string
                          description: Unique identifier for the tag
                          example: "0d744c04a320452d8d8343147f1089ba"
                        tagname:
                          type: string
                          description: Name of the lead tag
                          example: "HNI"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."

  /lead/get-locality:
    post:
      summary: Get Locality
      description: Fetches lead details based on the provided zipcode.
      operationId: getLocality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zipcode:
                  type: string
                  description: The zipcode to fetch locality details for.
                  example: "110094"
      responses:
        "200":
          description: Locality data fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Locality data fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id_district:
                          type: integer
                          description: Unique identifier for the district
                          example: 118
                        district:
                          type: string
                          description: Name of the district
                          example: "East Delhi"
                        id_state:
                          type: integer
                          description: Unique identifier for the state
                          example: 10
                        state:
                          type: string
                          description: Name of the state
                          example: "Delhi"
                        idcountry:
                          type: string
                          description: Unique identifier for the country
                          example: "ff604a944f1c4810b265519937d1ceb8"
                        countryname:
                          type: string
                          description: Name of the country
                          example: "India"
                        dialingcode:
                          type: string
                          description: Dialing code for the country
                          example: "+91"
                        longitude:
                          type: string
                          description: Longitude of the locality
                          example: "77.488839"
                        latitude:
                          type: string
                          description: Latitude of the locality
                          example: "13.765421"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."

  /lead/get-lead-tags-by-id:
    post:
      summary: Get Lead Tags by ID
      description: Fetches tags associated with a specific lead based on the provided lead ID.
      operationId: getLeadTagsById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idlead:
                  type: string
                  description: The unique identifier for the lead.
                  example: "974fc64c97b34dd6a9ec547a8532fcff"
      responses:
        "200":
          description: Lead tags fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Lead tags fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        idmeta_tag_type:
                          type: string
                          description: Unique identifier for the meta tag type
                          example: "0d744c04a320452d8d8343147f1089ba"
                        tag:
                          type: string
                          description: Name of the tag
                          example: "HNI"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."

  /lead/get-lead-by-id:
    post:
      summary: Get Lead by ID
      description: Fetches details of a lead based on the provided lead ID.
      operationId: getLeadById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idlead:
                  type: string
                  description: The unique identifier for the lead.
                  example: "974fc64c97b34dd6a9ec547a8532fcff"
      responses:
        "200":
          description: Lead fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Lead fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        idlead:
                          type: string
                          description: Unique identifier for the lead
                          example: "974fc64c97b34dd6a9ec547a8532fcff"
                        fullname:
                          type: string
                          description: Full name of the lead
                          example: "Rajesh Gupta"
                        idmeta_lead_status:
                          type: string
                          description: Identifier for the lead status
                          example: "eb50fefac7f147d09049ccd156679a66"
                        leadstatus:
                          type: string
                          description: Current status of the lead
                          example: "Not Contacted"
                        idmeta_lead_type:
                          type: string
                          description: Identifier for the lead type
                          example: "b59726e1c21b4d3ab4067d08b27196b3"
                        leadtype:
                          type: string
                          description: Type of the lead
                          example: "Hot"
                        idmeta_source_type:
                          type: string
                          description: Identifier for the source type
                          example: "8dba7a199d904c0699b0da6b5510d318"
                        source:
                          type: string
                          description: Source of the lead
                          example: "Own"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."

  /lead/get-lead-contact-list:
    post:
      summary: Get lead contact list
      description: Retrieves the contact details for leads.
      operationId: getLeadContactList
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Contact records fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Contact records fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        identity_contact:
                          type: string
                          description: Unique identifier for the contact
                        contact_type:
                          type: string
                          description: Type of contact information
                        contact_value:
                          type: string
                          description: Contact value (e.g., phone number)
                        countrycode:
                          type: string
                          description: Country code associated with the contact
                        countryname:
                          type: string
                          description: Name of the country associated with the contact
                        dialingcode:
                          type: string
                          description: Dialing code for the country
                        address_line_1:
                          type: string
                          description: First line of the address
                        address_line_2:
                          type: string
                          description: Second line of the address
                        location_name:
                          type: string
                          description: Location name for the contact
                        state:
                          type: string
                          description: State of the contact address
                        pincode:
                          type: integer
                          description: Pincode of the contact address

  /profile/get-entity-contact-list:
    get:
      summary: Get entity contact list
      description: Retrieves the contact details for an entity.
      operationId: getEntityContactList
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsIng1dCI6IjNQYUs0RWZ5Qk5RdTNDdGpZc2EzWW1oUTVFMCIsImtpZCI6IjNQYUs0RWZ5Qk5RdTNDdGpZc2EzWW1oUTVFMCJ9."
      responses:
        "200":
          description: Contact records fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Contact records fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        identity_contact:
                          type: string
                          description: Unique identifier for the contact
                          example: "d754ea56a598141bac61f0317b5ef700"
                        contact_type:
                          type: string
                          description: Type of contact information
                          example: "Primary Mobile Number"
                        contact_value:
                          type: string
                          description: Contact value (e.g., phone number)
                          example: "9091342931"
                        countrycode:
                          type: string
                          description: Country code associated with the contact
                          example: "IN"
                        countryname:
                          type: string
                          description: Name of the country associated with the contact
                          example: "India"
                        dialingcode:
                          type: string
                          description: Dialing code for the country
                          example: "+91"
                        address_line_1:
                          type: string
                          description: First line of the address
                          example: "123 Main St"
                        address_line_2:
                          type: string
                          description: Second line of the address
                          example: "Apt 4B"
                        location_name:
                          type: string
                          description: Location name for the contact
                          example: "Gurugram"
                        state:
                          type: string
                          description: State of the contact address
                          example: "Haryana"
                        pincode:
                          type: integer
                          description: Pincode of the contact address

  /profile/get-nominee-details:
    get:
      summary: Get Nominee details
      description: Retrieves the nominee details for entity.
      operationId: getNomineeDetails
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Nominee details fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Meta Data retrieved successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        entity_nominee:
                          type: string
                          description: Unique identifier for the Nominee
                          example: "4678e1bb1f2d414393a85dfbe0c85fff"
                        nominee_title_meta:
                          type: string
                          description: Title meta of the Nominee
                          example: "3f5536eacbda4d21bf568b6c3eb34982"
                        nominee_title:
                          type: string
                          description: Title of the Nominee
                          example: "Mr"
                        fullname:
                          type: string
                          description: Full name of the Nominee
                          example: "Amit Kumar"
                        nominee_relationship_meta:
                          type: string
                          description: Relationship meta of the Nominee
                          example: "1b2d70de-6a1e-4b7a-98b5-7c61fd5e3f88"
                        nominee_relationship:
                          type: string
                          description: Relationship of the Nominee
                          example: "Mother"
                        nominee_dob:
                          type: string
                          description: DOB of the Nominee
                          example: "12/12/2000"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized access."

  /profile/update-contact:
    put:
      summary: Update the contact details
      description: Update the contact details with the provided information.
      operationId: updateProfileContact
      parameters:
        - name: authorization
          in: header
