  /search/global-search:
    post:
      summary: Perform a global search based on the given search text.
      description: This endpoint allows users to search globally for functionalities using a search term.
      operationId: globalSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ntid:
                  type: string
                  description: NTID of the user (optional).
                  example: ""
                userType:
                  type: string
                  description: Type of user initiating the search.
                  example: "Leader"
                searchText:
                  type: string
                  description: Text to search for.
                  example: "app"
      responses:
        "200":
          description: Global search successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code.
                    example: 200
                  message:
                    type: string
                    description: Status message.
                    example: "Global Search successful"
                  data:
                    type: array
                    description: List of functionalities that match the search query.
                    items:
                      type: object
                      properties:
                        idfunctionality:
                          type: string
                          description: Unique identifier for the functionality.
                          example: "C68BBBDE6B62411F91634C36EE61C0ED"
                        created_by:
                          type: string
                          nullable: true
                          description: User who created the functionality.
                          example: null
                        last_modified_by:
                          type: string
                          nullable: true
                          description: User who last modified the functionality.
                          example: null
                        active:
                          type: boolean
                          description: Whether the functionality is active.
                          example: true
                        functionality_class_path:
                          type: string
                          nullable: true
                          description: Path for the functionality class.
                          example: null
                        functionality_class_type:
                          type: string
                          nullable: true
                          description: Type of the functionality class.
                          example: null
                        functionality_code:
                          type: string
                          description: Code identifying the functionality.
                          example: "GLOBAL_SEARCH_APP_TRACKER"
                        icon_url:
                          type: string
                          description: URL to the icon associated with the functionality.
                          example: "global-search-icon/App_Tracker.png"
                        name:
                          type: string
                          description: Name of the functionality.
                          example: "App Tracker"
                        functionality_type_id:
                          type: string
                          nullable: true
                          description: ID of the functionality type.
                          example: null
                        functionality_type_master:
                          type: string
                          description: Master type of the functionality.
                          example: "FUNCTIONALITY_GLOBAL_SEARCH"
                        created_date:
                          type: string
                          nullable: true
                          description: Date the functionality was created.
                          example: null
                        last_modified_date:
                          type: string
                          nullable: true
                          description: Date the functionality was last modified.
                          example: null

