        "200":
          description: Contact updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Contact updated successfully"
                  data:
                    type: object
                    nullable: true
                    description: The response data is null since the update is performed.
