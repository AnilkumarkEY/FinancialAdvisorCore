          application/json:
            schema:
              type: object
              required:
                - favouriteManageDto
              properties:
                favouriteManageDto:
                  type: array
                  description: List of favourite functionalities to be added or updated.
                  items:
                    type: object
                    required:
                      - idfunctionality
                      - display_order
                      - eventMasterId
                      - nt_id
                      - enabled
                    properties:
                      idfunctionality:
                        type: string
                        description: Unique identifier for the functionality.
                        example: "F120DB2DD51B42DA9E83164C207C0881"
                      display_order:
                        type: string
                        description: Order in which the functionality is displayed.
                        example: "6"
                      eventMasterId:
                        type: string
                        description: Master ID of the event associated with the functionality.
                        example: "C6CD58A46CF3413684B57719F215CAC2"
                      nt_id:
                        type: string
                        description: NT ID of the user.
                        example: "90764"
                      enabled:
                        type: boolean
                        description: Indicates if the functionality is enabled.
